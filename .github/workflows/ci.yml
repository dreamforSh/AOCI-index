name: AOCI CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.8"
        include:
          - os: ubuntu-24.04
            python-version: "3.8"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run full unittest suite (in-process fast runner)
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Run real-subprocess smoke suite
        env:
          AOCI_TEST_SUBPROCESS: "1"
        run: python -B -m unittest tests/test_ext_pack.py tests/test_ext_zoom.py tests/test_v15_improvements.py -v

      - name: Verify CLI version
        run: python -B scripts/aoci_index.py --version

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python sdist and wheel
        run: |
          python -m pip install --upgrade --quiet build
          python -m build --outdir dist

      - name: Package skill archives, checksums, and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: python -B .github/scripts/build_release.py --tag "$TAG_NAME" --repo "$GH_REPO" --outdir dist --notes-out release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "AOCI Index $TAG_NAME" --notes-file release_notes.md $PRERELEASE_FLAG
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "AOCI Index $TAG_NAME" --notes-file release_notes.md $PRERELEASE_FLAG
          fi
