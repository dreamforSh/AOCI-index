name: AOCI CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.12"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.8"
        include:
          - os: ubuntu-24.04
            python-version: "3.8"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run full unittest suite (in-process fast runner)
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

      - name: Run real-subprocess smoke suite
        env:
          AOCI_TEST_SUBPROCESS: "1"
        run: python -B -m unittest tests/test_ext_pack.py tests/test_ext_tests.py tests/test_ext_zoom.py tests/test_v15_improvements.py tests/test_v16_optimizations.py tests/test_p0_p1_fixes.py tests/test_perf_scale.py tests/test_feature_extensions.py tests/test_startup_and_docs_consistency.py tests/test_retrieval_freshness_watch.py -v

      - name: Verify CLI version
        run: python -B scripts/aoci_index.py --version

  lint:
    name: Lint & type check (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dev tools
        run: python -m pip install --quiet "ruff==0.17.6" "mypy==2.4.1"

      - name: ruff (pyflakes + bugbear + syntax, config in pyproject.toml)
        run: python -m ruff check .

      - name: mypy (config in pyproject.toml)
        run: python -m mypy

      - name: mypy for Windows-only code paths
        run: python -m mypy --platform win32

  package:
    name: Build & verify sdist/wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel (wheel is built from the sdist)
        run: |
          python -m pip install --upgrade --quiet build twine
          python -m build --outdir dist

      - name: Validate metadata
        run: python -m twine check --strict dist/*

      - name: Verify sdist and wheel contents
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for need in ("SKILL.md", "CHANGELOG.md", "MANIFEST.in", "examples/self-pool.json.gz", "resources/plugin.json", "references/aoci-format-spec.md", "assets/logo.svg"):
              assert any(n.endswith("/" + need) for n in sdist), f"sdist is missing {need}"
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for need in ("SKILL.md", "examples/self-pool.json.gz", "resources/plugin.json", "references/hooks-and-install.md", "scripts/aoci_mcp.py"):
              assert "aoci_core/_skill_bundle/" + need in wheel, f"wheel skill bundle is missing {need}"
          assert not any("/tests/" in n or n.startswith("tests/") for n in wheel), "tests must not ship in the wheel"
          print(f"sdist files={len(sdist)} wheel files={len(wheel)}")
          PY

      - name: Smoke-test the wheel in an isolated venv
        run: |
          python -m venv /tmp/aoci-wheel-venv
          /tmp/aoci-wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/aoci-wheel-venv/bin/python -c "import importlib.util, pathlib, aoci_core; assert importlib.util.find_spec('install') is None; assert (pathlib.Path(aoci_core.__file__).parent / '_skill_bundle' / 'SKILL.md').is_file()"
          /tmp/aoci-wheel-venv/bin/aoci-index --version
          /tmp/aoci-wheel-venv/bin/aoci-mcp --help
          /tmp/aoci-wheel-venv/bin/aoci-install --host claude-code --scope global --home-dir /tmp/aoci-wheel-home --dry-run

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  coverage:
    name: Coverage (in-process suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install --quiet "coverage==7.17.4"

      - name: Run suite under coverage
        run: python -B -m coverage run -m unittest discover -s tests -p "test_*.py"

      - name: Coverage report (fails below the recorded floor)
        run: |
          python -m coverage report --fail-under=70
          python -m coverage xml -o coverage.xml

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  treesitter-parity:
    name: Optional tree-sitter accelerator parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional tree-sitter backend
        run: python -m pip install --quiet "tree-sitter-language-pack>=0.6.0"

      - name: Run full suite with tree-sitter enabled (parity + thread-safety tests un-skip)
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

  release:
    name: Build & Publish Release
    needs: [test, lint, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the verified sdist/wheel from the package job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Package skill archives, checksums, and release notes
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: python -B .github/scripts/build_release.py --tag "$TAG_NAME" --repo "$GH_REPO" --outdir dist --notes-out release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "AOCI Index $TAG_NAME" --notes-file release_notes.md $PRERELEASE_FLAG
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* --title "AOCI Index $TAG_NAME" --notes-file release_notes.md $PRERELEASE_FLAG
          fi
