[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoci-index"
version = "1.5.0"
description = "Zero-dependency AI-Oriented Codebase Indexer (.aoci/) with BM25/FRAS graph reader, task context packer, symbol zoom, lifecycle hooks, and stdio MCP server."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
aoci-index = "aoci_index:main"
aoci-mcp = "aoci_mcp:serve_stdio"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["aoci_index", "aoci_mcp", "aoci_hook", "install"]
packages = ["aoci_core"]
